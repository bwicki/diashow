<!DOCTYPE html>
<html lang="de" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Referentensicht – Diashow</title>
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/app.css">
<script>try{const t=localStorage.getItem('diashow.theme');if(t)document.documentElement.dataset.theme=JSON.parse(t);}catch(e){}</script>
</head>
<body class="refbody">
<div id="ref" class="ref"><div class="ref-idle"><p>Verbinde mit dem Hauptfenster …</p></div></div>
<script>
  // Die Referentensicht wird vollständig vom Hauptfenster (Beamer) gefüllt und gesteuert.
  (function attach(n) {
    try { if (window.opener && window.opener.__diashowAttach) { window.opener.__diashowAttach(window); return; } } catch (e) {}
    if (n < 20) setTimeout(function () { attach(n + 1); }, 250);
    else document.getElementById('ref').innerHTML = '<div class="ref-idle"><p>Kein Hauptfenster gefunden. Bitte die Referentensicht aus der Diashow-App öffnen (Schritt 3 · Vorführen).</p></div>';
  })(0);
</script>
</body>
</html>
