<!DOCTYPE html>
<html lang="de" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diashow</title>
<meta name="theme-color" content="#f4f5f7">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="icon" href="icons/favicon.ico" sizes="48x48 32x32 16x16" type="image/x-icon">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/app.css">
<script>try{const t=localStorage.getItem('diashow.theme');if(t)document.documentElement.dataset.theme=JSON.parse(t);}catch(e){}</script>
<!-- Aufrufzähler portal.wicki.aero: meldet nur die App-ID, keine Personendaten -->
<script src="https://portal.wicki.aero/hit.js" data-app="diashow" defer></script>
</head>
<body>
<div class="app">
  <header class="topbar" id="topbar">
    <div class="title-block">
      <div class="eyebrow" id="eyebrow">Ballon · Diashow</div>
      <h1><span id="title">Diashow</span> <button class="ver" id="appVersion" type="button" title="Version">–</button></h1>
      <div class="sub" id="subtitle"></div>
    </div>
    <nav class="mainnav" id="mainnav" aria-label="Hauptnavigation"></nav>
    <div class="header-tools" id="tools"></div>
    <button class="btn icon logbtn" id="logBtn" type="button" title="Protokoll" aria-label="Protokoll"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M6 3h9l4 4v14H6z M15 3v4h4 M9 11h7 M9 15h7 M9 19h4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg><span class="logbadge" id="logBadge" hidden></span></button>
    <button class="btn icon" id="menuBtn" type="button" title="Menü" aria-label="Menü"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
    <img class="header-logo" alt="Wicki Partners Ballonteam" src="img/wicki-logo.png">
    <div class="menu hidden" id="menu"></div>
    <div class="logpanel hidden" id="logPanel"><div class="loghead"><b id="logTitle">Protokoll</b><span class="sp"></span><button class="btn mini" id="msgAll" type="button">Alle kopieren</button><button class="btn mini" id="logClear" type="button">Leeren</button></div><div class="msgs" id="msgs"></div><div class="logempty" id="logEmpty">–</div></div>
  </header>
  <main class="main" id="view">
    <section class="view" id="v-lib"></section>
    <section class="view" id="v-ed"></section>
    <section class="view" id="v-play"></section>
  </main>
</div>
<div id="stage" class="stage" hidden></div>
<script type="module" src="js/app.js"></script>
</body>
</html>
